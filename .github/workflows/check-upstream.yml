name: 게임 업데이트 감시

# 매일 Bitburner 최신 릴리스를 확인해서, 이 패치의 지원 버전보다 새 버전이 나오면 이슈를 만든다.
on:
  schedule:
    - cron: '17 3 * * *' # 매일 12:17 (한국 시간)
  workflow_dispatch:
    inputs:
      test_latest:
        description: '시험용: 최신 버전을 이 값으로 가정한다 (예: v9.9.9). 비우면 실제 값을 쓴다.'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TEST_LATEST: ${{ inputs.test_latest }}
    steps:
      - uses: actions/checkout@v4

      - name: 지원 버전과 최신 버전 비교
        id: ver
        run: |
          supported=$(grep -oP "SUPPORTED_GAME_VERSION = '\K[0-9.]+" apply.js)
          if [ -n "$TEST_LATEST" ]; then
            latest="$TEST_LATEST"
          else
            latest=$(gh api repos/bitburner-official/bitburner-src/releases/latest --jq .tag_name)
          fi
          latest="${latest#v}"
          if ! [[ "$supported" =~ ^[0-9]+(\.[0-9]+)*$ && "$latest" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "버전 형식이 올바르지 않습니다: supported='$supported' latest='$latest'"
            exit 1
          fi
          echo "지원 버전: $supported / 최신 버전: $latest"
          newer=$(printf '%s\n%s\n' "$supported" "$latest" | sort -V | tail -n 1)
          if [ "$supported" != "$latest" ] && [ "$newer" = "$latest" ]; then
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          else
            echo "outdated=false" >> "$GITHUB_OUTPUT"
          fi
          echo "supported=$supported" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: 새 버전 대응 이슈 만들기
        if: steps.ver.outputs.outdated == 'true'
        env:
          SUPPORTED: ${{ steps.ver.outputs.supported }}
          LATEST: ${{ steps.ver.outputs.latest }}
        run: |
          title="Bitburner v${LATEST} 업데이트 대응"
          count=$(gh issue list --state all --search "\"${title}\" in:title" --json number --jq 'length')
          if [ "$count" != "0" ]; then
            echo "이미 이슈가 있습니다. 건너뜁니다."
            exit 0
          fi
          gh label create upstream-update --description "게임 업데이트 대응" --color FBCA04 2>/dev/null || true
          {
            echo "Bitburner 새 버전이 나왔습니다. 이 패치의 지원 버전은 v${SUPPORTED}입니다."
            echo
            echo "- 새 버전: https://github.com/bitburner-official/bitburner-src/releases/tag/v${LATEST}"
            echo "- Steam 쪽에 반영됐는지는 게임 폴더의 \`resources/app/package.json\` 버전으로 확인합니다."
            echo
            echo "## 할 일"
            echo "- [ ] Steam 게임이 새 버전으로 업데이트됐는지 확인"
            echo "- [ ] \`node extract.js\`로 바뀐 원문을 뽑고 \`node tools/stats.js\`로 미번역 개수 확인"
            echo "- [ ] 새 문장 번역 후 \`node apply.js\`로 적용"
            echo "- [ ] 게임을 띄워 사이드바를 전부 열어 크래시 점검"
            echo "- [ ] \`apply.js\`의 \`SUPPORTED_GAME_VERSION\`과 README의 지원 버전 수정"
            echo "- [ ] \`pwsh tools/build-release.ps1\`로 zip을 만들어 새 릴리스 업로드"
            echo
            echo "_이 이슈는 \`게임 업데이트 감시\` 워크플로가 자동으로 만들었습니다._"
          } > body.md
          gh issue create --title "$title" --body-file body.md --label upstream-update
